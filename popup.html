<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地双语翻译</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <span class="mark">译</span>
      <div><strong>本地双语翻译</strong><small>文字只在这台 Mac 上处理</small></div>
    </header>
    <button id="translate" class="primary">翻译当前网页</button>
    <button id="remove" class="secondary">移除中文译文</button>
    <button id="autoSite" class="site-toggle">将此网站加入自动翻译</button>
    <div id="progress" class="progress" hidden><i></i></div>
    <p id="status" class="status">准备就绪</p>
    <footer><button id="settings">设置与连接测试</button></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
